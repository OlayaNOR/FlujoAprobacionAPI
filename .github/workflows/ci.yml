name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unitarias, integración con Testcontainers (el runner ya trae Docker), contrato OpenAPI y cobertura mínima
      - run: ./mvnw -B verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura
          path: "*/target/site/jacoco/"
          if-no-files-found: ignore
      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-de-pruebas
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: ignore

  imagen:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen
        run: docker build -t flujos-api .
