spring:
  application:
    name: flujos-aprobacion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flujos}
    username: ${DB_USER:flujos_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${DB_MIGRATOR_USER:flujos_migrador}
    password: ${DB_MIGRATOR_PASSWORD}
    placeholders:
      appPassword: ${DB_PASSWORD}

app:
  seguridad:
    jwt:
      secreto: ${JWT_SECRET}
      expiracion-access: PT15M
      expiracion-refresh: P7D
      emisor: flujos-api
      audiencia: flujos-clientes
  negocio:
    moneda-base: USD

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
